# Reference: https://github.com/i3/i3/blob/next/etc/config

config-version = 2

# In i3, all workspaces are phantom
persistent-workspaces = []

# i3 doesn't have "normalizations" feature that why we disable them here.
# But the feature is very helpful.
# Normalizations eliminate all sorts of weird tree configurations that don't make sense.
# Give normalizations a chance and enable them back.
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = false

# i3 default: new workspaces start as side-by-side tiles
default-root-container-layout = 'tiles'
default-root-container-orientation = 'horizontal'

# Mouse follows focus when focused monitor changes
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Open workspaces on the big Dell ultrawide when it is connected; otherwise fall back
# to the main display. AeroSpace has no "largest monitor" pattern, so the monitor is
# matched by name: update 'DELL' if the external monitor changes.
[workspace-to-monitor-force-assignment]
    1 = ['DELL', 'main']
    2 = ['DELL', 'main']
    3 = ['DELL', 'main']
    4 = ['DELL', 'main']
    5 = ['DELL', 'main']
    6 = ['DELL', 'main']
    7 = ['DELL', 'main']
    8 = ['DELL', 'main']
    9 = ['DELL', 'main']
    10 = ['DELL', 'main']

[mode.main.binding]
    # See: https://nikitabobko.github.io/AeroSpace/goodies#open-a-new-window-with-applescript
    alt-enter = '''exec-and-forget osascript -e \
    'tell application "Terminal" to tell (do script) to activate' '''

    # New terminal in the working directory of the focused Terminal/iTerm2 window
    alt-n = 'exec-and-forget /Users/klaashofman/Development/Rimshot/sandbox/aerospace/new-terminal.sh'

    # Chrome is the default browser; --new-window makes it open a window even if already running
    alt-c = 'exec-and-forget open -n -a "Google Chrome" --args --new-window'

    # 'kill' in i3 (i3 uses alt-shift-q)
    alt-q = 'close'

    # i3 wraps focus by default
    alt-j =         'focus --boundaries-action wrap-around-the-workspace left'
    alt-k =         'focus --boundaries-action wrap-around-the-workspace down'
    alt-l =         'focus --boundaries-action wrap-around-the-workspace up'
    alt-semicolon = 'focus --boundaries-action wrap-around-the-workspace right'

    # Arrow-key equivalents of the focus bindings above
    alt-left =  'focus --boundaries-action wrap-around-the-workspace left'
    alt-down =  'focus --boundaries-action wrap-around-the-workspace down'
    alt-up =    'focus --boundaries-action wrap-around-the-workspace up'
    alt-right = 'focus --boundaries-action wrap-around-the-workspace right'

    alt-shift-j = 'move left'
    alt-shift-k = 'move down'
    alt-shift-l = 'move up'
    alt-shift-semicolon = 'move right'

    # Arrow-key equivalents of the move bindings above
    alt-shift-left =  'move left'
    alt-shift-down =  'move down'
    alt-shift-up =    'move up'
    alt-shift-right = 'move right'

    # Send the focused window to the big (Dell) or small (built-in) monitor, keeping focus on it
    alt-pageUp =   'move-node-to-monitor --focus-follows-window DELL'
    alt-pageDown = 'move-node-to-monitor --focus-follows-window built-in'

    # Consider using 'join-with' command as a 'split' replacement if you want to enable
    # normalizations
    alt-h = 'split horizontal'

    # Launches a new VS Code instance (-n) rather than focusing an existing one
    alt-v = 'exec-and-forget open -n "/Users/klaashofman/Applications/Visual Studio Code.app"'

    alt-f = 'fullscreen'

    alt-s = 'layout v_accordion' # 'layout stacking' in i3
    alt-w = 'layout h_accordion' # 'layout tabbed' in i3
    alt-e = 'layout tiles horizontal vertical' # 'layout toggle split' in i3

    alt-shift-space = 'layout floating tiling' # 'floating toggle' in i3

    # Not supported, because this command is redundant in AeroSpace mental model.
    # See: https://nikitabobko.github.io/AeroSpace/guide#floating-windows
    #alt-space = 'focus toggle_tiling_floating'

    # `focus parent`/`focus child` are not yet supported, and it's not clear whether they
    # should be supported at all https://github.com/nikitabobko/AeroSpace/issues/5
    # alt-a = 'focus parent'

    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'
    alt-0 = 'workspace 10'

    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'
    alt-shift-6 = 'move-node-to-workspace 6'
    alt-shift-7 = 'move-node-to-workspace 7'
    alt-shift-8 = 'move-node-to-workspace 8'
    alt-shift-9 = 'move-node-to-workspace 9'
    alt-shift-0 = 'move-node-to-workspace 10'

    alt-shift-c = 'reload-config'

    alt-r = 'mode resize'

[mode.resize.binding]
    h = 'resize width -50'
    j = 'resize height +50'
    k = 'resize height -50'
    l = 'resize width +50'
    enter = 'mode main'
    esc = 'mode main'
